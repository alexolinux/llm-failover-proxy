services:
  llm-failover-proxy:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: llm-failover-proxy
    env_file:
      - path: llm-failover.env
        required: false
    environment:
      - PORT=4000
      - HOST=0.0.0.0
    ports:
      - "0.0.0.0:4000:4000"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    restart: unless-stopped
